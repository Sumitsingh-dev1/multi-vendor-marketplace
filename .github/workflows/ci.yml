name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace_ci -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://marketplace_ci:ci_only_password@localhost:5432/marketplace_test
      RUN_DB_INTEGRATION_TESTS: "1"
      SECRET_KEY: ci-only-not-a-real-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      algorithm: HS256
      SMTP_HOST: smtp.example.test
      SMTP_PORT: "587"
      SMTP_USER: ci-user
      SMTP_PASSWORD: ci-only-password
      SMTP_FROM: no-reply@example.test
      RAZORPAY_KEY_ID: ci_fake_key_id
      RAZORPAY_KEY_SECRET: ci_fake_key_secret
      RAZORPAY_WEBHOOK_SECRET: ci_fake_webhook_secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Create test database
        env:
          PGPASSWORD: ci_only_password
        run: psql -h localhost -U marketplace_ci -d postgres -c "CREATE DATABASE marketplace_test;"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest -q
