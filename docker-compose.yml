services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_dev}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-database.sh:/docker-entrypoint-initdb.d/10-init-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-marketplace_dev}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.docker}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      algorithm: HS256
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-unused}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-unused}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.test}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      ENABLE_DB_TEST_ENDPOINT: "false"
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  marketplace_postgres_data:
    name: marketplace_postgres_data
